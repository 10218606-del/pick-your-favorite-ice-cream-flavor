<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html>
  
<head>
   <!--The head section contains general information about the webpage.-->
   <title> Ice Cream Stats </title>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"> </script>
   <style>
       /* The style section controls how pieces of your webpage look. */
       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }

       body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background-color: #f1f5f9;
           color: #0f172a;
           min-height: 100vh;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           padding: 2rem 1rem;
       }

       header {
           text-align: center;
           margin-bottom: 1.5rem;
       }

       header h2 {
           font-size: 2rem;
           font-weight: 700;
           color: #1e293b;
           letter-spacing: -0.025em;
       }

       /* Container Card */
       div[x-data="webApp"] {
           background-color: #ffffff;
           width: 100%;
           max-width: 420px;
           padding: 2rem;
           border-radius: 16px;
           box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
           border: 1px solid #e2e8f0;
       }

       .section-title {
           display: block;
           font-size: 0.875rem;
           font-weight: 600;
           color: #475569;
           text-transform: uppercase;
           letter-spacing: 0.05em;
           margin-bottom: 0.5rem;
       }

       select {
           width: 100%;
           padding: 0.75rem 1rem;
           font-size: 1rem;
           font-family: inherit;
           color: #123588;
           background-color: #f8fafc;
           border: 1px solid #cbd5e1;
           border-radius: 8px;
           outline: none;
           margin-bottom: 1.5rem;
           cursor: pointer;
           transition: border-color 0.2s, box-shadow 0.2s;
       }
       button {
           width: 100%;
           padding: 0.75rem 1rem;
           font-size: 1rem;
           font-weight: 600;
           color: #ffffff;
           background-color: #2563eb;
           border: none;
           border-radius: 8px;
           cursor: pointer;
           margin-bottom: 1.5rem;
           transition: background-color 0.2s;
       }

       button:hover {
           background-color: #1d4ed8;
       }

       select:focus {
           border-color: #2563eb;
           box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
           background-color: #ffffff;
       }
        /* Red error banner style */
       .error-banner {
          background-color: #fef2f2;
          color: #dc2626;
          border: 1px solid #fecaca;
          padding: 0.75rem;
          border-radius: 8px;
          font-size: 0.875rem;
          font-weight: 600;
          text-align: center;
          margin-bottom: 1rem;
       }
       p {
           font-size: 1rem;
           color: #334155;
           margin-top: 0.75rem;
           line-height: 1.5;
       }

       p span {
           font-weight: 700;
           color: #a82a45;
       }

       footer {
           margin-top: 2rem;
           text-align: center;
           font-size: 0.875rem;
           color: #64748b;
           line-height: 1.6;
       }
   </style>
</head> <!--Gemini helped with doing the UI-->


<body>
   <!--The body section contains the content of your webpage.-->
   <header>
       <h2> Ice cream stats    </h2> <!--title -->
   </header>
   <div x-data="webApp"><!--Bug solved with the use of gemini-->
    <span class="section-title"> Dropdown Menu</span>
   <!-- @change can be used with dropdown menus. -->
    <select x-model="dropdownVal" @change="submitted = false">
    <option value="">-- Select --</option>
    <option value="Vanilla">Vanilla</option>
    <option value="Chocolate">Chocolate</option>
    <option value="Strawberry">Strawberry</option>
    <option value="Mint Chip">Mint Chocolate Chip</option>
    </select>

    
    <!--submit function --> 
    <button @click="submitChoice()">submit choice </button>

    <!-- On-screen error message shown if no selection was made -->
      <div x-show="showError" class="error-banner">
      ⚠️ Please select an ice cream flavor first!
      </div>
  
    <!--revels the ruslts after pressed--><!--BUG Gemini helped -->
    <div x-show="submitted"style="border-top: 1px solid #e2e8f0; padding-top: 0.5rem;">
      <p>Favorite ice cream flavor : <span x-text="dropdownVal"></span></p>
     <p>The percentage of people who like it : <span x-text="percentages[dropdownVal]"></span></p>
      </div>
    </div>
   <footer>
       <p>© 2026-2027<br>
       AP Computer Science Principles<br>
       George Washington High School made by Kareem fares </p>
   </footer>
  
   <script>
       //The script section contains the JavaScript logic
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
            dropdownVal: '',
            submitted: false,
            showError: false, 

            submitChoice() {
            if (this.dropdownVal !== '') {
           this.submitted = true;
           this.showError = false; 
           } else {
            this.showError = true;  <!--error banner Showon screen-->  
            this.submitted = false;
           }
          },

            percentages:{     <!--This is a list holding all the percentages-->
            'Vanilla': '59%',
            'Chocolate': '51%',
            'Strawberry': '43%',
            'Mint Chip' : '33%'
            }
           }));
       });
   </script>
</body>
</html>
